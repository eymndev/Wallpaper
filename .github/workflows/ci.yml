name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Temalar (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sözdizimi kontrolü
        run: for f in web/js/*.js web/js/themes/*.js packs/index.js packs/*/js/*.js; do node --check "$f"; done
      - name: Tema testleri
        run: node --test tests/*.test.mjs

  mac:
    name: macOS uygulaması
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: ./scripts/build-app.sh
      - name: Tema paketlerini kur
        run: |
          ./scripts/pack.sh add hyprland anime
          ./scripts/pack.sh list
      - name: Dışarıdan komutla tema değiştir (riceutil'in kullandığı bildirim)
        run: |
          defaults write dev.eymn.ascii-wallpaper theme lake
          open "build/ASCII Wallpaper.app"
          sleep 8
          pgrep -x AsciiWallpaper
          send() {
            osascript -l JavaScript -e '
              function run(argv) {
                ObjC.import("Foundation");
                var info = $.NSMutableDictionary.alloc.init;
                for (var i = 0; i + 1 < argv.length; i += 2) info.setObjectForKey(argv[i + 1], argv[i]);
                $.NSDistributedNotificationCenter.defaultCenter.postNotificationNameObjectUserInfoDeliverImmediately(
                  "dev.eymn.ascii-wallpaper.command", "riceutil", info, true);
              }' "$@" >/dev/null
          }
          # Etkin temanın sabit PNG'si macOS'un masaüstü resmi olur (kilit ekranında görünen)
          desktop_picture() {
            osascript -l JavaScript -e 'ObjC.import("AppKit"); $.NSWorkspace.sharedWorkspace.desktopImageURLForScreen($.NSScreen.mainScreen).path.js'
          }
          desktop_picture
          desktop_picture | grep -q "ASCII Wallpaper/desktop/lake-"
          send theme hypr-kath name 1
          sleep 3
          screencapture -x build/app-hypr-kath.png || true
          test "$(defaults read dev.eymn.ascii-wallpaper theme)" = hypr-kath
          desktop_picture | grep -q "ASCII Wallpaper/desktop/hypr-kath-"
          send theme bilinmeyen-tema
          sleep 1
          test "$(defaults read dev.eymn.ascii-wallpaper theme)" = hypr-kath
          send next 1 name 0 rotate 30
          sleep 1
          test "$(defaults read dev.eymn.ascii-wallpaper theme)" = hypr-end4
          test "$(defaults read dev.eymn.ascii-wallpaper showThemeName)" = 0
          test "$(defaults read dev.eymn.ascii-wallpaper rotateMinutes)" = 30
          send theme light-yagami
          sleep 3
          screencapture -x build/app-light-yagami.png || true
          test "$(defaults read dev.eymn.ascii-wallpaper theme)" = light-yagami
          # Paket kaldırılınca uygulama sayfaları yeniden açar, kayıtlı tema ilk temaya düşer
          ./scripts/pack.sh remove anime
          sleep 6
          test "$(defaults read dev.eymn.ascii-wallpaper theme)" = lake
          ./scripts/pack.sh add anime
          sleep 6
          send theme misa-train
          sleep 2
          test "$(defaults read dev.eymn.ascii-wallpaper theme)" = misa-train
          pkill -x AsciiWallpaper
      - name: Kurulum betiği
        run: |
          AW_INSTALL_DIR="$RUNNER_TEMP/Applications" ./scripts/install.sh --no-saver --no-open
          test -f "$RUNNER_TEMP/Applications/ASCII Wallpaper.app/Contents/Resources/web/themes.tsv"
          test -f "$RUNNER_TEMP/Applications/ASCII Wallpaper.app/Contents/Resources/web/packs.tsv"
          test -f "$HOME/Library/Application Support/ASCII Wallpaper/packs/anime/js/light.js"
          test -f "$RUNNER_TEMP/Applications/ASCII Wallpaper.app/Contents/Resources/web/desktop/lake.png"
          test -f "$HOME/Library/Application Support/ASCII Wallpaper/packs/anime/desktop/light-yagami.png"
      - name: Ekran koruyucuyu derle
        run: ./scripts/build-saver.sh
      - name: Ekran koruyucuyu yükleyip çizdir
        run: |
          swiftc -o build/check-saver scripts/check-saver.swift
          build/check-saver "build/ASCII Wallpaper.saver" lake matrix hypr-kath hypr-sollee hypr-corndog hypr-alba4k misa-train light-yagami thousand-sunny
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ekran-koruyucu-onizleme
          path: |
            build/saver-*.png
            build/app-*.png
      - name: Paketle
        run: |
          cd build
          ditto -c -k --keepParent "ASCII Wallpaper.app" ASCII-Wallpaper.zip
          ditto -c -k --keepParent "ASCII Wallpaper.saver" ASCII-Wallpaper-Saver.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ASCII-Wallpaper
          path: build/ASCII-Wallpaper.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ASCII-Wallpaper-Saver
          path: build/ASCII-Wallpaper-Saver.zip
