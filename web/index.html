<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII Wallpaper</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #070a16; overflow: hidden; cursor: default; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="ASCII karakterlerle çizilmiş hareketli duvar kağıdı"></canvas>

  <script src="js/util.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/ui.js"></script>
  <!-- Klasik temalar (her kurulumda var): yeni bir tema eklemek için js/themes içine dosya koyup buraya ekle.
       Paketteki temalar packs/<paket>/pack.json içinde listelenir. -->
  <script src="js/themes/lake.js"></script>
  <script src="js/themes/matrix.js"></script>
  <script src="js/themes/fire.js"></script>
  <script src="js/themes/city.js"></script>
  <script src="js/themes/starfield.js"></script>
  <script src="js/themes/plasma.js"></script>
  <script src="js/themes/desert.js"></script>
  <script src="js/themes/snow.js"></script>
  <script src="js/themes/aurora.js"></script>
  <script src="js/themes/life.js"></script>
  <script src="js/themes/donut.js"></script>
  <script src="js/themes/synthwave.js"></script>
  <script src="js/themes/aquarium.js"></script>
  <!-- Görsel temaların çizimi (paketlerdeki temalar kullanır) -->
  <script src="js/image.js"></script>
  <!-- Ayrı indirilen tema paketleri (Hyprland, Anime ...): bkz. js/packs.js ve packs/ -->
  <script src="js/packs.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
